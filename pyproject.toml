[project]
name = "arxiv-intelligence-search"
version = "3.0.0"
description = "AI search, classification, and RAG over 902,645 arXiv Computer Science papers."
authors = [{name = "Mohammed Bekkali", email = "mohamedbekkalill03@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "streamlit>=1.28",
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.11",
    "faiss-cpu>=1.7",
    "anthropic>=0.25",
    "python-dotenv>=1.0",
    "pyarrow>=14.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "black",
    "ruff",
]
train = [
    "iterative-stratification>=0.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"