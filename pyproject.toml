[project]
name = "arxiv-intelligence"
version = "0.1.0"
description = "ArXiv Semantic Intelligence Hub — ML-powered research paper discovery"
authors = [{name = "Mohammed BEKKALI", email = "mohamedbekkalill03@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "sentence-transformers>=2.2",
    "shap>=0.43",
    "umap-learn>=0.5",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.15",
    "streamlit>=1.28",
    "nltk>=3.8",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "black",
    "ruff",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
